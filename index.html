<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🏛️ 국회 탐험대 — 국회의 위상과 역할 퀴즈</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','맑은 고딕','Malgun Gothic',-apple-system,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;color:#111827;padding:20px}
.wrap{max-width:760px;margin:0 auto}
.card{background:#fff;border-radius:16px;padding:28px;box-shadow:0 10px 40px rgba(0,0,0,.15)}
h1{font-size:24px;font-weight:800;margin-bottom:6px;color:#1e3a8a}
.sub{color:#6b7280;font-size:13px;margin-bottom:20px}
.field{margin-bottom:14px}
label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px}
input,select{width:100%;padding:11px 13px;border:1.5px solid #d1d5db;border-radius:8px;font-size:14px;font-family:inherit;outline:none}
input:focus,select:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.btn{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border:none;border-radius:10px;padding:13px 24px;font-weight:700;font-size:15px;cursor:pointer;width:100%;font-family:inherit;transition:transform .1s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-sm{width:auto;padding:10px 18px;font-size:14px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.title{font-size:18px;font-weight:700;color:#1e3a8a}
.user-info{font-size:12px;color:#6b7280}
.badge{background:#eff6ff;color:#1d4ed8;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600}
.progress{height:9px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:12px 0 18px}
.progress > div{height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);transition:width .35s}
.qtag{display:inline-block;background:#fef3c7;color:#92400e;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;margin-bottom:10px;letter-spacing:.3px}
.question{font-size:17px;font-weight:600;line-height:1.55;margin-bottom:16px}
.choice{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid #e5e7eb;border-radius:10px;padding:13px 15px;margin-bottom:9px;cursor:pointer;font-size:14px;font-family:inherit;color:#111827;transition:all .15s}
.choice:hover:not(:disabled){border-color:#3b82f6;background:#eff6ff;transform:translateX(2px)}
.choice.correct{border-color:#10b981;background:#d1fae5;color:#065f46;font-weight:700}
.choice.wrong{border-color:#ef4444;background:#fee2e2;color:#991b1b}
.choice:disabled{cursor:default}
.feedback{margin-top:14px;padding:13px 15px;border-radius:8px;font-size:13.5px;line-height:1.6;display:none}
.feedback.show{display:block}
.feedback.ok{background:#ecfdf5;border-left:4px solid #10b981;color:#065f46}
.feedback.no{background:#fef2f2;border-left:4px solid #ef4444;color:#991b1b}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.score{font-size:14px;color:#374151;font-weight:600}
.result{text-align:center;padding:10px 0}
.result .emoji{font-size:64px;margin:6px 0}
.result h2{font-size:24px;margin:8px 0;color:#1e3a8a}
.result .big{font-size:54px;font-weight:800;background:linear-gradient(135deg,#2563eb,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:8px 0}
.result p{color:#4b5563;font-size:14px;margin:5px 0}
.send-status{margin-top:16px;padding:11px;border-radius:8px;font-size:13px}
.send-status.ok{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
.send-status.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.send-status.pending{background:#fef9c3;color:#713f12;border:1px solid #fde68a}
.timer{background:#fee2e2;color:#991b1b;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:700}
hr{border:none;border-top:1px solid #e5e7eb;margin:14px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="app"></div>
</div>

<script>
/* ================================================================
   ⚙️ 설정: Google Apps Script 웹앱 URL을 아래에 붙여넣으세요.
   설정 안내는 함께 제공된 가이드 문서를 참고해주세요.
   ================================================================ */
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw2R0ZhCI8ujuXCX7BZRFc0HtzEGEoIJhk7DdwCFMqSjqN1tWHRMP4-ShRsIN0hTB6oUw/exec"; // 예: "https://script.google.com/macros/s/AKfycbx.../exec"

/* ================================================================
   📚 문제 데이터 (15문항)
   ================================================================ */
const QUESTIONS = [
  // 대의제
  {topic:"대의제", q:"국민이 직접 정치에 참여하는 대신 대표자를 뽑아 국가 의사 결정을 맡기는 제도를 무엇이라 하나요?",
   choices:["직접민주제","대의제","연방제","의원내각제"], a:1,
   ex:"대의제(간접민주제)는 국민이 선출한 대표가 국민을 대신해 의사를 결정하는 제도입니다. 국회가 대의제의 핵심 기관이에요."},

  // 입법권 / 입법부
  {topic:"입법권 / 입법부", q:"법률을 만들고 고치는 권한인 '입법권'을 가진 국가 기관은?",
   choices:["행정부(정부)","사법부(법원)","입법부(국회)","헌법재판소"], a:2,
   ex:"입법권은 법률을 제·개정하는 권한이며, 우리나라에서는 국회(입법부)가 이 권한을 행사합니다."},

  {topic:"입법부", q:"입법부에 대한 설명으로 옳은 것은?",
   choices:["법을 집행하는 기관","법을 만드는 기관","법을 적용해 재판하는 기관","법을 해석하는 헌법기관"], a:1,
   ex:"입법부=법을 만드는 기관(국회), 행정부=법을 집행, 사법부=법을 적용해 재판. 삼권분립의 한 축이에요."},

  // 지역구 vs 비례대표
  {topic:"지역구 국회의원", q:"각 지역(선거구)에서 가장 많은 표를 얻어 선출되는 국회의원을 무엇이라 하나요?",
   choices:["비례대표 국회의원","지역구 국회의원","무소속 국회의원","상임위원"], a:1,
   ex:"지역구 국회의원은 특정 지역구의 유권자가 직접 뽑는 의원입니다. 해당 지역의 이익과 의견을 대변하는 역할을 해요."},

  {topic:"비례대표 국회의원", q:"비례대표 국회의원이 선출되는 기준으로 옳은 것은?",
   choices:["출신 지역의 인구","정당의 전국 득표 비율","후보자의 나이","의원 본인의 학력"], a:1,
   ex:"비례대표는 정당이 받은 득표율에 비례하여 의석을 배분받는 방식입니다. 다양한 직능·소수 의견을 대변하기 위함이에요."},

  // 본회의
  {topic:"본회의", q:"국회의원 전원이 모여 법률안 등 안건을 최종적으로 의결하는 회의는?",
   choices:["상임위원회","교섭단체 회의","본회의","공청회"], a:2,
   ex:"본회의는 국회의 최종 의결 기구로, 일반적으로 재적의원 과반수 출석과 출석의원 과반수 찬성으로 안건을 의결합니다."},

  // 상임위원회
  {topic:"상임위원회", q:"법률안을 본회의에 올리기 전, 분야별로 전문적으로 미리 심사하는 기구는?",
   choices:["교섭단체","상임위원회","국정감사단","청문회"], a:1,
   ex:"상임위원회는 교육·외교·국방 등 분야별로 나뉘어 안건을 전문 심사합니다. 효율적 의사 진행을 위한 핵심 장치예요."},

  // 교섭단체
  {topic:"교섭단체", q:"국회에서 의사 진행을 협의하기 위해 보통 20명 이상의 의원으로 구성하는 단체는?",
   choices:["상임위원회","교섭단체","정책위원회","원내정당"], a:1,
   ex:"교섭단체는 원칙적으로 20인 이상 소속 의원이 있는 정당이 구성하며, 국회 운영·의사일정 등을 협의합니다."},

  // 입법권한
  {topic:"국회 권한 — 입법", q:"다음 중 국회의 '입법에 관한 권한'에 해당하지 <b>않는</b> 것은?",
   choices:["법률 제정·개정","헌법 개정안 의결","조약 체결·비준 동의","예산안 편성"], a:3,
   ex:"예산안 '편성'은 정부의 권한이고, 국회는 이를 '심의·확정'합니다. 헌법개정·조약동의·법률제정은 모두 국회의 입법 관련 권한이에요."},

  {topic:"국회 권한 — 입법", q:"국회는 외국과 맺는 중요 조약에 대해 어떤 역할을 하나요?",
   choices:["조약을 직접 체결한다","체결·비준에 동의한다","조약을 해석한다","조약을 폐기만 결정한다"], a:1,
   ex:"조약 체결은 대통령이 하지만, 중요한 조약은 국회의 동의를 받아야 효력이 생깁니다. 이는 입법에 관한 권한 중 하나예요."},

  // 재정 권한
  {topic:"국회 권한 — 재정", q:"국회가 정부 예산을 심의해 확정하고 결산을 심사하는 권한은 어디에 속할까요?",
   choices:["입법에 관한 권한","국가 재정에 관한 권한","일반 국정에 관한 권한","사법에 관한 권한"], a:1,
   ex:"예산안 심의·확정, 결산 심사, 조세 법률주의 등은 모두 '국가 재정에 관한 권한'에 해당합니다."},

  {topic:"국회 권한 — 재정", q:"\"세금의 종목과 세율은 법률로 정한다\"는 원칙은 무엇이라 부르나요?",
   choices:["국정감사권","조세 법률주의","예산 편성권","재정 자치주의"], a:1,
   ex:"조세 법률주의는 국민의 재산권을 보호하기 위해 세금은 반드시 국회가 만든 법률로 정해야 한다는 원칙입니다."},

  // 일반 국정에 관한 권한
  {topic:"국회 권한 — 국정감사", q:"매년 정기적으로 국정 전반에 대해 행정부의 잘잘못을 따지는 국회의 활동은?",
   choices:["국정조사","국정감사","청문회","탄핵소추"], a:1,
   ex:"국정감사는 매년 정기국회 기간에 국정 전반을 정기적으로 점검합니다. 국정조사는 특정 사안이 발생했을 때 비정기적으로 진행돼요."},

  {topic:"국회 권한 — 국정조사", q:"특정한 국정 사안에 문제가 생겼을 때 국회가 비정기적으로 진상을 조사하는 권한은?",
   choices:["국정감사권","국정조사권","탄핵소추권","입법권"], a:1,
   ex:"국정조사권은 '특정 사안'에 대해 국회가 별도로 진상을 조사하는 권한입니다. 정기적인 국정감사와 구분해서 기억해 두세요!"},

  {topic:"국회 권한 — 탄핵소추", q:"대통령·국무총리·법관 등 고위 공직자가 헌법·법률을 위반했을 때 국회가 그 파면을 요구하는 권한은?",
   choices:["국정감사권","국정조사권","탄핵소추권","법률거부권"], a:2,
   ex:"탄핵소추권은 일반 국정에 관한 권한 중 하나입니다. 국회가 소추를 의결하면 헌법재판소가 최종적으로 탄핵 여부를 결정해요."}
];

/* ================================================================
   🎮 게임 로직
   ================================================================ */
let state = {
  screen: 'intro',
  name: '', cls: '', num: '',
  cur: 0, score: 0,
  startTime: null,
  answers: [], // [{topic,q,picked,correct,isOk,timeSec}]
  qStartTime: null,
  locked: false
};
const app = document.getElementById('app');

function shuffleQuestions(){
  // 학생마다 같은 순서로 보고싶다면 이 함수를 호출하지 마세요.
  // QUESTIONS.sort(()=>Math.random()-0.5);
}

function renderIntro(){
  app.innerHTML = `
    <h1>🏛️ 국회 탐험대</h1>
    <div class="sub">국회의 위상과 역할 — 개념 정리 퀴즈 (총 ${QUESTIONS.length}문항)</div>
    <div class="field">
      <label>이름</label>
      <input id="name" placeholder="홍길동" maxlength="20"/>
    </div>
    <div class="field">
      <label>반</label>
      <input id="cls" placeholder="3학년 2반" maxlength="20"/>
    </div>
    <div class="field">
      <label>번호</label>
      <input id="num" placeholder="15" maxlength="5" inputmode="numeric"/>
    </div>
    <button class="btn" id="startBtn">🚀 퀴즈 시작하기</button>
    <hr>
    <div style="font-size:12px;color:#6b7280;line-height:1.7">
      📝 <b>학습 목표</b><br>
      대의제, 입법권/입법부, 지역구·비례대표 의원, 본회의·상임위원회·교섭단체,<br>
      국회의 입법·재정·일반 국정 권한(국정감사·조사·탄핵소추) 개념 이해
    </div>
  `;
  document.getElementById('startBtn').onclick = ()=>{
    const n = document.getElementById('name').value.trim();
    const c = document.getElementById('cls').value.trim();
    const nu = document.getElementById('num').value.trim();
    if(!n || !c || !nu){ alert('이름·반·번호를 모두 입력해 주세요!'); return; }
    state.name=n; state.cls=c; state.num=nu;
    state.startTime = Date.now();
    state.screen='quiz';
    renderQuiz();
  };
}

function renderQuiz(){
  const Q = QUESTIONS[state.cur];
  state.qStartTime = Date.now();
  state.locked = false;
  app.innerHTML = `
    <div class="header">
      <div>
        <div class="title">🏛️ 국회 탐험대</div>
        <div class="user-info">${state.cls} · ${state.num}번 ${state.name}</div>
      </div>
      <span class="badge">${state.cur+1} / ${QUESTIONS.length}</span>
    </div>
    <div class="progress"><div style="width:${(state.cur/QUESTIONS.length)*100}%"></div></div>
    <span class="qtag">${Q.topic}</span>
    <p class="question">${Q.q}</p>
    <div id="choices"></div>
    <div class="feedback" id="fb"></div>
    <div class="actions">
      <span class="score">점수: ${state.score}점</span>
      <button class="btn btn-sm" id="nextBtn" disabled>${state.cur===QUESTIONS.length-1?'결과 보기 🏆':'다음 문제 →'}</button>
    </div>
  `;
  const choicesEl = document.getElementById('choices');
  Q.choices.forEach((c,i)=>{
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = `${['①','②','③','④'][i]} ${c}`;
    b.onclick = ()=>pick(i,b,Q);
    choicesEl.appendChild(b);
  });
  document.getElementById('nextBtn').onclick = ()=>{
    state.cur++;
    if(state.cur>=QUESTIONS.length){ state.screen='result'; renderResult(); }
    else renderQuiz();
  };
}

function pick(i,btn,Q){
  if(state.locked) return;
  state.locked = true;
  const timeSec = Math.round((Date.now()-state.qStartTime)/1000);
  const all = document.querySelectorAll('.choice');
  all.forEach(b=>b.disabled=true);
  const fb = document.getElementById('fb');
  const isOk = (i===Q.a);
  if(isOk){
    btn.classList.add('correct');
    state.score += 10;
    fb.className = 'feedback show ok';
    fb.innerHTML = `✅ <b>정답!</b> ${Q.ex}`;
  }else{
    btn.classList.add('wrong');
    all[Q.a].classList.add('correct');
    fb.className = 'feedback show no';
    fb.innerHTML = `❌ <b>아쉬워요.</b> 정답: <b>${Q.choices[Q.a]}</b><br>${Q.ex}`;
  }
  state.answers.push({
    topic: Q.topic,
    question: Q.q.replace(/<[^>]+>/g,''),
    picked: Q.choices[i],
    correct: Q.choices[Q.a],
    isOk: isOk,
    timeSec: timeSec
  });
  document.querySelector('.score').textContent = `점수: ${state.score}점`;
  document.getElementById('nextBtn').disabled = false;
}

function renderResult(){
  const max = QUESTIONS.length*10;
  const pct = Math.round(state.score/max*100);
  const totalSec = Math.round((Date.now()-state.startTime)/1000);
  let msg='👍 잘했어요!', emoji='🎉';
  if(pct===100){msg='완벽해요! 국회 박사!'; emoji='🏆';}
  else if(pct>=80){msg='훌륭해요!'; emoji='🌟';}
  else if(pct>=60){msg='조금만 더 복습해요!'; emoji='📘';}
  else{msg='교과서 다시 한 번 보고 도전!'; emoji='💪';}

  // 오답 분석
  const wrongs = state.answers.filter(a=>!a.isOk);
  const wrongList = wrongs.length
    ? `<div style="text-align:left;margin-top:14px;padding:12px;background:#fef9c3;border-radius:8px;font-size:12.5px;line-height:1.6">
         <b>📌 다시 볼 개념:</b><br>${wrongs.map(w=>`• ${w.topic}`).join('<br>')}
       </div>`
    : `<div style="margin-top:14px;padding:12px;background:#d1fae5;border-radius:8px;font-size:13px;color:#065f46"><b>🎯 모든 문제를 맞혔어요!</b></div>`;

  app.innerHTML = `
    <div class="result">
      <div class="emoji">${emoji}</div>
      <h2>${msg}</h2>
      <div class="big">${state.score} / ${max}</div>
      <p>정답률 <b>${pct}%</b> · 소요시간 ${totalSec}초</p>
      <p style="font-size:12px;color:#9ca3af">${state.cls} · ${state.num}번 ${state.name}</p>
      ${wrongList}
      <div id="sendStatus" class="send-status pending">📤 결과를 선생님께 전송 중...</div>
      <button class="btn" id="retryBtn" style="margin-top:14px">다시 도전하기 🔄</button>
    </div>
  `;
  document.getElementById('retryBtn').onclick = ()=>{
    state = {screen:'intro',name:'',cls:'',num:'',cur:0,score:0,startTime:null,answers:[],qStartTime:null,locked:false};
    renderIntro();
  };

  // Google Sheets 전송
  sendToSheet(pct,totalSec);
}

function sendToSheet(pct,totalSec){
  const status = document.getElementById('sendStatus');
  if(!GOOGLE_SCRIPT_URL){
    status.className = 'send-status err';
    status.innerHTML = '⚠️ Google Sheets URL이 설정되지 않았습니다. 선생님께 알려주세요.';
    return;
  }

  const payload = {
    timestamp: new Date().toISOString(),
    name: state.name,
    cls: state.cls,
    num: state.num,
    score: state.score,
    maxScore: QUESTIONS.length*10,
    percent: pct,
    totalSec: totalSec,
    correctCount: state.answers.filter(a=>a.isOk).length,
    wrongTopics: state.answers.filter(a=>!a.isOk).map(a=>a.topic).join(' | '),
    answers: JSON.stringify(state.answers)
  };

  // CORS 우회를 위해 text/plain 방식 사용 (Apps Script doPost 호환)
  fetch(GOOGLE_SCRIPT_URL, {
    method:'POST',
    mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  }).then(()=>{
    status.className = 'send-status ok';
    status.innerHTML = '✅ 결과가 선생님께 전송되었습니다!';
  }).catch(err=>{
    status.className = 'send-status err';
    status.innerHTML = '⚠️ 전송 실패. 화면을 캡처해서 선생님께 보여주세요.';
    console.error(err);
  });
}

renderIntro();
</script>
